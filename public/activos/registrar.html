<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activo</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="registro">
    <a class="btn-volver" href="../index.html">&larr; Volver al menú</a>
    <h1>Registro de un activo</h1>
    <form id="form-activo">
        <div>
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria">
        </div>

        <div>
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion">
        </div>

        <div>
            <label for="fotografia">Fotografía</label>
            <input type="text" id="fotografia">
        </div>

        <div>
            <label for="estado">Estado</label>
            <input type="text" id="estado">
        </div>

        <div>
            <label for="precio">Precio</label>
            <input type="number" id="precio">
        </div>

        <button id="registrarActivo" type="submit">Registrar</button>
    </form>

    <script type="module" src="/js/activo/activo.registrar.js"></script>
</body>
</html>
